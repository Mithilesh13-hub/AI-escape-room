services:
  - type: web
    name: ai-escape-room
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_TTL_DAYS
        value: "30"
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: SESSION_TOKEN_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
